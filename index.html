<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Flange Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script>
        const { useState, useMemo, useEffect } = React;
        const { Search, Layers, FileSpreadsheet, Upload, ChevronDown } = lucide;

        const UNC_THREAD_DATA = {
            "1/2": "13", "5/8": "11", "3/4": "10", "7/8": "9", "1": "8",
            "1-1/8": "7", "1-1/4": "7", "1-3/8": "6", "1-1/2": "6",
            "1-5/8": "8", "1-3/4": "5", "1-7/8": "8", "2": "4.5"
        };

        const B16_5_RF_DATA = {
            "0.5": 34.9, "0.75": 42.9, "1": 50.8, "1.25": 63.5, "1.5": 73.0, 
            "2": 92.1, "2.5": 104.8, "3": 127.0, "3.5": 139.7, "4": 157.2, 
            "5": 185.7, "6": 215.9, "8": 269.9, "10": 323.8, "12": 381.0, 
            "14": 412.8, "16": 469.9, "18": 533.4, "20": 584.2, "24": 692.2
        };

        const B16_5_HOLE_DATA = {
            "0.5": 15.9, "0.75": 19.1, "1": 19.1, "1.25": 19.1, "1.5": 22.2, 
            "2": 19.1, "2.5": 22.2, "3": 22.2, "3.5": 22.2, "4": 22.2, 
            "5": 22.2, "6": 22.2, "8": 25.4, "10": 28.6, "12": 31.8, 
            "14": 31.8, "16": 34.9, "18": 34.9, "20": 34.9, "24": 41.3
        };

        const App = () => {
            const [data, setData] = useState([]);
            const [groups, setGroups] = useState([]);
            const [selectedGroup, setSelectedGroup] = useState('');
            const [selectedRating, setSelectedRating] = useState('');
            const [sizeInput, setSizeInput] = useState('');
            const [isFileLoaded, setIsFileLoaded] = useState(false);

            const parseSize = (s) => {
                if (!s) return null;
                let c = s.replace(/"/g, '').trim();
                if (c.includes(' ')) { const p = c.split(' '); const f = p[1].split('/'); return (parseFloat(p[0]) + (parseFloat(f[0])/parseFloat(f[1]))).toString(); }
                if (c.includes('/')) { const f = c.split('/'); return (parseFloat(f[0])/parseFloat(f[1])).toString(); }
                return parseFloat(c).toString();
            };

            const getFullBoltSpec = (b) => { if (!b) return "-"; const c = b.replace(/"/g, '').trim(); return UNC_THREAD_DATA[c] ? `${b}-${UNC_THREAD_DATA[c]} UNC` : b; };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const wb = XLSX.read(evt.target.result, { type: 'array' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(ws, { header: 1 });
                    const rows = json.slice(3).filter(r => r[3] && r[4]);
                    const parsed = rows.map(c => ({
                        type: String(c[2] || ''), group: String(c[3] || ''), size: String(c[4] || ''), rating: String(c[5] || ''),
                        sSize: String(c[6] || ''), sOD: String(c[7] || ''), sBCD: String(c[9] || ''), sStdThick: String(c[11] || ''), sMyThick: String(c[12] || ''), sBoltSize: String(c[13] || ''), sQty: String(c[14] || ''), sMatl: String(c[16] || ''), sStudSpec: String(c[20] || ''),
                        dSize: String(c[21] || ''), dOD: String(c[22] || ''), dBCD: String(c[24] || ''), dStdThick: String(c[26] || ''), dMyThick: String(c[27] || ''), dBoltSize: String(c[28] || ''), dQty: String(c[29] || ''), dMatl: String(c[31] || ''), dStudSpec: String(c[35] || '')
                    }));
                    setData(parsed);
                    const gs = [...new Set(parsed.map(i => i.group))].sort();
                    setGroups(gs);
                    if (gs.length > 0) setSelectedGroup(gs[0]);
                    setIsFileLoaded(true);
                };
                reader.readAsArrayBuffer(file);
            };

            const availableRatings = useMemo(() => [...new Set(data.filter(i => i.group === selectedGroup).map(i => i.rating))].sort(), [selectedGroup, data]);
            useEffect(() => { if (availableRatings.length > 0) setSelectedRating(availableRatings[0]); }, [availableRatings]);

            const filtered = useMemo(() => {
                if (!selectedGroup || !selectedRating) return null;
                const s = sizeInput.toLowerCase().replace(/\s/g,'');
                return data.find(i => i.group === selectedGroup && i.rating === selectedRating && (i.size.toLowerCase().replace(/\s/g,'').includes(s)));
            }, [selectedGroup, selectedRating, sizeInput, data]);

            const InfoRow = ({ label, value, highlight, isCompany }) => (
                <div className="flex justify-between py-2 border-b border-slate-100 last:border-0">
                    <span className="text-[10px] font-bold text-slate-500 uppercase">{label}</span>
                    <span className={`text-sm font-black ${highlight ? 'text-indigo-600' : 'text-slate-800'}`}>{value || "-"}</span>
                </div>
            );

            return React.createElement('div', { className: "min-h-screen bg-slate-100 p-4 md:p-8 flex flex-col items-center" },
                React.createElement('div', { className: "max-w-5xl w-full" },
                    React.createElement('h1', { className: "text-3xl font-black text-center mb-8 uppercase" }, "API Flange Master"),
                    !isFileLoaded ? 
                        React.createElement('div', { className: "bg-white p-12 rounded-3xl shadow-xl text-center" },
                            React.createElement('label', { className: "cursor-pointer bg-indigo-600 text-white px-8 py-4 rounded-2xl font-bold" }, "파일 업로드",
                                React.createElement('input', { type: "file", className: "hidden", onChange: handleFileUpload })
                            )
                        ) :
                        React.createElement('div', { className: "space-y-6" },
                            React.createElement('div', { className: "bg-white p-6 rounded-3xl grid md:grid-cols-3 gap-4" },
                                React.createElement('select', { className: "p-3 bg-slate-100 rounded-xl font-bold", onChange: (e) => setSelectedGroup(e.target.value) }, groups.map(g => React.createElement('option', { key: g, value: g }, g))),
                                React.createElement('select', { className: "p-3 bg-slate-100 rounded-xl font-bold", value: selectedRating, onChange: (e) => setSelectedRating(e.target.value) }, availableRatings.map(r => React.createElement('option', { key: r, value: r }, r))),
                                React.createElement('input', { className: "p-3 bg-slate-100 rounded-xl font-bold", placeholder: "Search Model", onChange: (e) => setSizeInput(e.target.value) })
                            ),
                            filtered ? 
                                React.createElement('div', { className: "grid lg:grid-cols-2 gap-6" },
                                    React.createElement('div', { className: "bg-white p-6 rounded-3xl shadow" }, React.createElement('h2', { className: "font-black mb-4" }, "SUCTION (", filtered.sSize, "\")"), React.createElement(InfoRow, { label: "OD", value: filtered.sOD }), React.createElement(InfoRow, { label: "Bolt", value: getFullBoltSpec(filtered.sBoltSize), highlight: true })),
                                    React.createElement('div', { className: "bg-white p-6 rounded-3xl shadow" }, React.createElement('h2', { className: "font-black mb-4" }, "DISCHARGE (", filtered.dSize, "\")"), React.createElement(InfoRow, { label: "OD", value: filtered.dOD }), React.createElement(InfoRow, { label: "Bolt", value: getFullBoltSpec(filtered.dBoltSize), highlight: true }))
                                ) : React.createElement('p', { className: "text-center text-slate-500" }, "결과가 없습니다.")
                        )
                )
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>
