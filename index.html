    const App = () => {
      const [activeTab, setActiveTab] = useState('database');

      // Excel / Database State
      const [data, setData] = useState([]);
      const [groups, setGroups] = useState([]);
      const [selectedGroup, setSelectedGroup] = useState('');
      const [selectedRating, setSelectedRating] = useState('');
      const [sizeInput, setSizeInput] = useState('');
      const [isFileLoaded, setIsFileLoaded] = useState(false);
      const [error, setError] = useState(null);

      // Standalone Calculator State
      const [calcRating, setCalcRating] = useState('150');
      const [calcSize, setCalcSize] = useState('2');

      const parseSize = (sizeStr) => {
        if (!sizeStr) return null;
        let cleanSize = sizeStr.replace(/"/g, '').trim();
        if (cleanSize.includes(' ')) {
          const parts = cleanSize.split(' ');
          const fraction = parts[1].split('/');
          return (parseFloat(parts[0]) + (parseFloat(fraction[0]) / parseFloat(fraction[1]))).toString();
        } else if (cleanSize.includes('/')) {
          const fraction = cleanSize.split('/');
          return (parseFloat(fraction[0]) / parseFloat(fraction[1])).toString();
        }
        return parseFloat(cleanSize).toString();
      };

      const getFractionDisplay = (sizeVal) => {
        const num = parseFloat(sizeVal);
        if (isNaN(num)) return sizeVal;
        
        const fractionMap = {
          "0.5": "1/2", "0.75": "3/4", "1": "1", "1.25": "1-1/4",
          "1.5": "1-1/2", "2": "2", "2.5": "2-1/2", "3": "3",
          "3.5": "3-1/2", "4": "4", "5": "5", "6": "6", "8": "8",
          "10": "10", "12": "12", "14": "14", "16": "16", "18": "18",
          "20": "20", "24": "24"
        };
        return fractionMap[sizeVal] ? `${fractionMap[sizeVal]}"` : `${sizeVal}"`;
      };

      const getFullBoltSpec = (boltSizeStr) => {
        if (!boltSizeStr) return "-";
        const cleanSize = boltSizeStr.replace(/"/g, '').trim();
        const tpi = UNC_THREAD_DATA[cleanSize];
        return tpi ? `${boltSizeStr}-${tpi} UNC` : boltSizeStr;
      };

      const getRFDiameter = (sizeStr) => {
        const numSize = parseSize(sizeStr);
        return B16_5_RF_DATA[numSize] ? `${B16_5_RF_DATA[numSize]} mm` : "-";
      };

      const getHoleSize = (sizeStr) => {
        const numSize = parseSize(sizeStr);
        return B16_5_HOLE_DATA[numSize] ? `${B16_5_HOLE_DATA[numSize]} mm` : "-";
      };

      const handleFileUpload = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const arrayBuffer = e.target.result;
            const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            
            const rows = jsonData.slice(3).filter(row => row[3] && row[4]);
            const parsedData = rows.map(cols => ({
              type: String(cols[2] || '').trim(),
              group: String(cols[3] || '').trim(),
              size: String(cols[4] || '').trim(),
              rating: String(cols[5] || '').trim(),
              sSize: String(cols[6] || '').trim(),
              sOD: String(cols[7] || '').trim(),
              sBCD: String(cols[9] || '').trim(),
              sStdThick: String(cols[11] || '').trim(),
              sMyThick: String(cols[12] || '').trim(),
              sBoltSize: String(cols[13] || '').trim(),
              sQty: String(cols[14] || '').trim(),
              sMatl: String(cols[16] || '').trim(),
              sStudSpec: String(cols[20] || '').trim(),
              dSize: String(cols[21] || '').trim(),
              dOD: String(cols[22] || '').trim(),
              dBCD: String(cols[24] || '').trim(),
              dStdThick: String(cols[26] || '').trim(),
              dMyThick: String(cols[27] || '').trim(),
              dBoltSize: String(cols[28] || '').trim(),
              dQty: String(cols[29] || '').trim(),
              dMatl: String(cols[31] || '').trim(),
              dStudSpec: String(cols[35] || '').trim(),
            }));

            setData(parsedData);
            const uniqueGroups = [...new Set(parsedData.map(item => item.group))].sort();
            setGroups(uniqueGroups);
            if (uniqueGroups.length > 0) setSelectedGroup(uniqueGroups[0]);
            setIsFileLoaded(true);
            setError(null);
          } catch (err) {
            setError("파일 분석 오류. 열 배치가 올바르지 않거나 손상된 엑셀 파일일 수 있습니다.");
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const loadMockData = () => {
        setData(MOCK_PUMP_DATA);
        const uniqueGroups = [...new Set(MOCK_PUMP_DATA.map(item => item.group))].sort();
        setGroups(uniqueGroups);
        if (uniqueGroups.length > 0) setSelectedGroup(uniqueGroups[0]);
        setIsFileLoaded(true);
        setError(null);

      const availableRatings = useMemo(() => {
        if (!selectedGroup) return [];
        const ratings = data.filter(item => item.group === selectedGroup).map(item => item.rating);

        }
      }, [availableRatings]);

        const searchStr = sizeInput.toLowerCase().replace(/\s/g,'');
        return data.find(item => 
          item.group === selectedGroup && 
          item.rating === selectedRating &&
          (item.size.toLowerCase().replace(/\s/g,'') === searchStr || 
           item.size.toLowerCase().replace(/\s/g,'').includes(searchStr))

                      >
                        <PlayIcon className="text-emerald-400" />
                        샘플 데이터로 가구동
                      </button>
                    </div>

                    {error && (
                      <div className="mt-8 p-4 bg-red-50 text-red-700 border border-red-200 rounded-2xl text-xs font-bold flex items-center justify-center gap-2">
                        <AlertTriangleIcon className="text-red-500 shrink-0" />
                        {error}
                      </div>
                    )}

                    <div className="mt-12 pt-6 border-t border-slate-100 text-left">
                      <h4 className="text-xs font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-1.5">
                        <InfoIcon className="text-slate-400" /> 엑셀 업로드 템플릿 열 가이드 (4번째 Row부터 분석시작)
                      </h4>
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-[10px] text-slate-500 font-bold">
                        <div>Col 2: TYPE (설계타입)</div>
                        <div>Col 3: GROUP (펌프그룹)</div>
                        <div>Col 4: SIZE (모델명)</div>
                        <div>Col 5: RATING (압력)</div>
                        <div>Col 6: Suction Size (인치)</div>
                        <div>Col 11: Suction 표준두께</div>
                        <div>Col 12: Suction 당사두께</div>
                        <div>Col 13: Suction 볼트규격</div>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-6 animate-in fade-in slide-in-from-top-4 duration-500">
                    
                    {/* Search Controller */}
                    <div className="bg-white rounded-3xl shadow-sm border border-slate-200/60 p-6 grid grid-cols-1 md:grid-cols-3 gap-6 items-end">
                      <div className="w-full">
                        <label className="text-[10px] font-black text-slate-400 mb-2 block tracking-widest px-1">1. PUMP GROUP</label>
                        <div className="relative">
                          <select 
                            value={selectedGroup} 
                            onChange={(e) => setSelectedGroup(e.target.value)} 
                            className="w-full p-4 pr-10 bg-slate-50 hover:bg-slate-100/70 border border-slate-200 rounded-2xl font-black text-slate-800 appearance-none outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-sm"
                          >
                            {groups.map(group => <option key={group} value={group}>{group}</option>)}
                          </select>
                          <ChevronDownIcon className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none w-5 h-5" />
                        </div>
                      </div>

                      <div className="w-full">
                        <label className="text-[10px] font-black text-slate-400 mb-2 block tracking-widest px-1">2. RATING</label>
                        <div className="relative">
                          <select 
                            value={selectedRating} 
                            onChange={(e) => setSelectedRating(e.target.value)} 
                            className="w-full p-4 pr-10 bg-slate-50 hover:bg-slate-100/70 border border-slate-200 rounded-2xl font-black text-slate-800 appearance-none outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-sm"
                          >
                            {availableRatings.map(rate => <option key={rate} value={rate}>{rate}</option>)}
                          </select>
                          <ChevronDownIcon className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none w-5 h-5" />
                        </div>
                      </div>

                      <div className="w-full">
                        <label className="text-[10px] font-black text-slate-400 mb-2 block tracking-widest px-1">3. PUMP SIZE / MODEL SEARCH</label>
                        <div className="relative">
                          <input 
                            type="text" 
                            value={sizeInput} 
                            onChange={(e) => setSizeInput(e.target.value)} 
                            placeholder="예시: 10X8-25 또는 3X2" 
                            className="w-full p-4 pl-12 bg-slate-50 hover:bg-slate-100/70 border border-slate-200 rounded-2xl font-black text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-sm placeholder:text-slate-400" 
                          />
                          <div className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><SearchIcon /></div>
                        </div>
                      </div>
                    </div>

                    {filteredResult ? (
                      <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        
                        {/* Suction Card */}
                        <div className="bg-white rounded-[2.5rem] shadow-xl border border-slate-100 overflow-hidden transition-all hover:shadow-2xl">
                          <div className="bg-indigo-600 p-6 text-white flex justify-between items-center">
                            <div>
                              <p className="text-[9px] font-black opacity-75 uppercase tracking-wider mb-1 italic">Inlet Section</p>
                              <h2 className="text-3xl font-black tracking-tight">SUCTION</h2>
                            </div>
                            <div className="text-right">
                              <p className="text-[9px] font-black opacity-75 uppercase mb-1 tracking-wider">Flange Size</p>
                              <span className="text-4xl font-black leading-none">{filteredResult.sSize}"</span>
                            </div>
                          </div>
                          
                          <div className="p-8">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-8">
                              
                              {/* Standard Column */}
                              <div className="space-y-6">
                                <div>
                                  <h4 className="text-[12px] font-black text-indigo-600 uppercase tracking-wider mb-3 border-l-4 border-indigo-600 pl-3">ASME B16.5 규격</h4>
                                  <div className="space-y-1">
                                    <InfoRow label="플랜지 외경 (OD)" value={`${filteredResult.sOD} mm`} />
                                    <InfoRow label="RF단 외경" value={getRFDiameter(filteredResult.sSize)} highlight />
                                    <InfoRow label="피치원 지름 (B.C.D)" value={`${filteredResult.sBCD} mm`} />
                                    <InfoRow label="볼트 홀 직경" value={getHoleSize(filteredResult.sSize)} highlight />
                                    <InfoRow label="규격 두께 (t)" value={`${filteredResult.sStdThick} mm`} />
                                  </div>
                                </div>
                                
                                <div>
                                  <h4 className="text-[12px] font-black text-amber-600 uppercase tracking-wider mb-3 border-l-4 border-amber-600 pl-3">당사 제작 사양</h4>
                                  <div className="space-y-1">
                                    <InfoRow label="적용 제작 두께" value={`${filteredResult.sMyThick} mm`} isCompany highlight />
                                  </div>
                                </div>
                              </div>

                              {/* Bolt Specification Column */}
                              <div className="space-y-6">
                                <div>
                                  <h4 className="text-[12px] font-black text-slate-800 uppercase tracking-wider mb-3 border-l-4 border-slate-800 pl-3">BOLT 규격</h4>
                                  <div className="space-y-1">
                                    <InfoRow label="나사산 규격" value={getFullBoltSpec(filteredResult.sBoltSize)} highlight />
                                    <InfoRow label="볼트 수량" value={`${filteredResult.sQty} EA`} />
                                    <InfoRow label="재질 기준" value={filteredResult.sMatl} />
                                  </div>
                                </div>
                              </div>

                            </div>
                            
                            {/* Stud Bolt Spec Detail Box */}
                            <div className="mt-8 pt-6 border-t border-slate-100">
                              <h4 className="text-[12px] font-black text-indigo-900 uppercase tracking-wider mb-3 border-l-4 border-indigo-900 pl-3">STUD BOLT 발주 스펙</h4>
                              <div className="bg-indigo-50/40 p-4.5 rounded-2xl border border-indigo-100/50">
                                <span className="text-[9px] font-bold text-indigo-400 uppercase tracking-widest block mb-1">Detailed Description</span>
                                <p className="text-sm font-black text-indigo-950 leading-snug">
                                  {filteredResult.sStudSpec || "기재된 상세 스펙 정보가 없습니다."}
                                </p>
                              </div>
                            </div>

                          </div>
                        </div>

                        {/* Discharge Card */}
                        <div className="bg-white rounded-[2.5rem] shadow-xl border border-slate-100 overflow-hidden transition-all hover:shadow-2xl">
                          <div className="bg-emerald-600 p-6 text-white flex justify-between items-center">
                            <div>
                              <p className="text-[9px] font-black opacity-75 uppercase tracking-wider mb-1 italic">Outlet Section</p>
                              <h2 className="text-3xl font-black tracking-tight">DISCHARGE</h2>
                            </div>
                            <div className="text-right">
                              <p className="text-[9px] font-black opacity-75 uppercase mb-1 tracking-wider">Flange Size</p>
                              <span className="text-4xl font-black leading-none">{filteredResult.dSize}"</span>
                            </div>
                          </div>
                          
                          <div className="p-8">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-8">
                              
                              {/* Standard Column */}
                              <div className="space-y-6">
                                <div>
                                  <h4 className="text-[12px] font-black text-emerald-600 uppercase tracking-wider mb-3 border-l-4 border-emerald-600 pl-3">ASME B16.5 규격</h4>
                                  <div className="space-y-1">
                                    <InfoRow label="플랜지 외경 (OD)" value={`${filteredResult.dOD} mm`} />
                                    <InfoRow label="RF단 외경" value={getRFDiameter(filteredResult.dSize)} highlight />
                                    <InfoRow label="피치원 지름 (B.C.D)" value={`${filteredResult.dBCD} mm`} />
                                    <InfoRow label="볼트 홀 직경" value={getHoleSize(filteredResult.dSize)} highlight />
                                    <InfoRow label="규격 두께 (t)" value={`${filteredResult.dStdThick} mm`} />
                                  </div>
                                </div>
                                
                                <div>
                                  <h4 className="text-[12px] font-black text-amber-600 uppercase tracking-wider mb-3 border-l-4 border-amber-600 pl-3">당사 제작 사양</h4>
                                  <div className="space-y-1">
                                    <InfoRow label="적용 제작 두께" value={`${filteredResult.dMyThick} mm`} isCompany highlight />
                                  </div>
                                </div>
                              </div>

                              {/* Bolt Specification Column */}
                              <div className="space-y-6">
                                <div>
                                  <h4 className="text-[12px] font-black text-slate-800 uppercase tracking-wider mb-3 border-l-4 border-slate-800 pl-3">BOLT 규격</h4>
                                  <div className="space-y-1">
                                    <InfoRow label="나사산 규격" value={getFullBoltSpec(filteredResult.dBoltSize)} highlight />
                                    <InfoRow label="볼트 수량" value={`${filteredResult.dQty} EA`} />
                                    <InfoRow label="재질 기준" value={filteredResult.dMatl} />
                                  </div>
                                </div>
                              </div>

                            </div>
                            
                            {/* Stud Bolt Spec Detail Box */}
                            <div className="mt-8 pt-6 border-t border-slate-100">
                              <h4 className="text-[12px] font-black text-emerald-900 uppercase tracking-wider mb-3 border-l-4 border-emerald-900 pl-3">STUD BOLT 발주 스펙</h4>
                              <div className="bg-emerald-50/40 p-4.5 rounded-2xl border border-emerald-100/50">
                                <span className="text-[9px] font-bold text-emerald-500 uppercase tracking-widest block mb-1">Detailed Description</span>
                                <p className="text-sm font-black text-emerald-950 leading-snug">
                                  {filteredResult.dStudSpec || "기재된 상세 스펙 정보가 없습니다."}
                                </p>
                              </div>
                            </div>

                          </div>
                        </div>

                        {/* Bottom Selected Pump Summary Panel */}
                        <div className="lg:col-span-2 bg-slate-900 rounded-[2rem] p-6 grid grid-cols-2 md:grid-cols-4 gap-6 shadow-xl relative overflow-hidden text-white">
                          <div className="absolute right-0 top-0 translate-x-12 -translate-y-12 w-40 h-40 bg-indigo-500/10 rounded-full blur-2xl"></div>
                          
                          <div className="text-center md:text-left md:pl-4">
                            <p className="text-[9px] font-black text-indigo-400 uppercase tracking-widest mb-1">Model Name</p>
                            <p className="text-xl font-black">{filteredResult.size}</p>
                          </div>
                          <div className="text-center md:text-left">
                            <p className="text-[9px] font-black text-indigo-400 uppercase tracking-widest mb-1">Pressure Rating</p>
                            <p className="text-xl font-black">{filteredResult.rating}</p>
                          </div>
                          <div className="text-center md:text-left">
                            <p className="text-[9px] font-black text-indigo-400 uppercase tracking-widest mb-1">Pump Structure</p>
                            <p className="text-xl font-black text-emerald-400">{filteredResult.type}</p>
                          </div>
                          <div className="text-center md:text-left">
                            <p className="text-[9px] font-black text-indigo-400 uppercase tracking-widest mb-1">Pump Group Class</p>
                            <p className="text-xl font-black text-amber-400">{filteredResult.group.split(' - ')[0] || filteredResult.group}</p>
                          </div>
                        </div>

                      </div>
                    ) : (
                      <div className="bg-white rounded-[3rem] border-2 border-dashed border-slate-200 p-16 text-center shadow-inner">
                        <div className="text-slate-300 flex justify-center mb-4"><SearchIcon /></div>
                        <h3 className="text-base font-black text-slate-400 uppercase tracking-wider mb-1">모델 매칭 중</h3>
                        <p className="text-slate-400 text-xs font-semibold max-w-sm mx-auto leading-relaxed">
                          상단의 PUMP SIZE 입력 칸에 펌프 고유 번호 또는 배관 사이즈 규격을 정확히 입력해주세요. (예: 10X8-25)
                        </p>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {/* ================= TAB 2: STANDALONE ASME CALCULATOR ================= */}
            {activeTab === 'calculator' && (
              <div className="animate-in fade-in slide-in-from-top-4 duration-500 max-w-4xl mx-auto">
                <div className="bg-white rounded-[2.5rem] shadow-xl border border-slate-100 p-6 md:p-10">
                  
                  <div className="flex items-center gap-3 mb-6">
                    <div className="bg-indigo-50 p-3 rounded-2xl text-indigo-600">
                      <CalculatorIcon />
                    </div>
                    <div>
                      <h2 className="text-xl font-black text-slate-900">ASME B16.5 규격 마스터 캘큘레이터</h2>
                      <p className="text-slate-500 text-xs font-semibold">인치 규격을 넣으면 외경, PCD, 볼트 수량 및 드릴 직경을 즉시 조회합니다.</p>
                    </div>
                  </div>

                  {/* Selector Bar */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 bg-slate-50 p-5 rounded-2xl mb-8 border border-slate-200/50">
                    <div>
                      <label className="text-[10px] font-black text-slate-400 mb-2 block tracking-widest px-1">CLASS PRESSURE RATING</label>
                      <div className="flex gap-2">
                        {['150', '300'].map((r) => (
                          <button
                            key={r}
                            onClick={() => setCalcRating(r)}
                            className={`flex-1 py-3.5 rounded-xl font-black text-xs uppercase tracking-wider transition-all ${
                              calcRating === r 
                                ? 'bg-indigo-600 text-white shadow-md shadow-indigo-100' 
                                : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100'
                            }`}
                          >
                            Class {r}#
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="text-[10px] font-black text-slate-400 mb-2 block tracking-widest px-1">NOMINAL PIPE SIZE (NPS)</label>
                      <div className="relative">
                        <select
                          value={calcSize}
                          onChange={(e) => setCalcSize(e.target.value)}
                          className="w-full p-3.5 pr-10 bg-white border border-slate-200 rounded-xl font-black text-slate-800 appearance-none outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                        >
                          {Object.keys(ASME_STANDARDS_DB[calcRating]).map(sizeVal => (
                            <option key={sizeVal} value={sizeVal}>
                              {getFractionDisplay(sizeVal)} ({sizeVal} Inch)
                            </option>
                          ))}
                        </select>
                        <ChevronDownIcon className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none w-5 h-5" />
                      </div>
                    </div>
                  </div>

                  {/* Dimensional Reference Result Grid */}
                  {currentCalcData ? (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                      
                      {/* Flange Dimensions */}
                      <div className="space-y-6">
                        <h3 className="text-xs font-black text-indigo-700 uppercase tracking-widest border-l-4 border-indigo-600 pl-3">
                          플랜지 바디 치수 정보 (Flange Dimensions)
                        </h3>
                        <div className="bg-slate-50/50 rounded-2xl p-4 border border-slate-100 space-y-1">
                          <InfoRow label="플랜지 호칭경" value={`${calcSize} Inch (${getFractionDisplay(calcSize)})`} />
                          <InfoRow label="플랜지 외경 (OD)" value={`${currentCalcData.od} mm`} highlight />
                          <InfoRow label="B16.5 규격 두께 (t)" value={`${currentCalcData.thick} mm`} />
                          <InfoRow label="피치원 지름 (B.C.D)" value={`${currentCalcData.bcd} mm`} highlight />
                          <InfoRow label="Raised Face 외경 (RF)" value={`${currentCalcData.rf} mm`} />
                        </div>
                      </div>

                      {/* Drilling & Bolting Specifications */}
                      <div className="space-y-6">
                        <h3 className="text-xs font-black text-slate-800 uppercase tracking-widest border-l-4 border-slate-800 pl-3">
                          볼트 체결 및 홀 타공 정보 (Bolting Spec)
                        </h3>
                        <div className="bg-slate-50/50 rounded-2xl p-4 border border-slate-100 space-y-1">
                          <InfoRow label="체결 볼트 규격 (NPS)" value={getFullBoltSpec(currentCalcData.boltSize)} highlight />
                          <InfoRow label="인치당 나사산 (UNC TPI)" value={`${UNC_THREAD_DATA[currentCalcData.boltSize] || "-"} 산`} />
                          <InfoRow label="볼트 홀 타공 직경 (Hole)" value={`${currentCalcData.boltHole} mm`} highlight />
                          <InfoRow label="체결 구멍 수량 (Qty)" value={`${currentCalcData.holes} 홀 (EA)`} />
                        </div>
                      </div>

                      {/* Mechanical Standard Blueprint Hint */}
                      <div className="md:col-span-2 bg-amber-50/40 p-5 rounded-2xl border border-amber-200/50 flex items-start gap-4">
                        <div className="bg-amber-100/70 p-2.5 rounded-xl text-amber-800 shrink-0">
                          <InfoIcon />
                        </div>
                        <div>
                          <h4 className="text-xs font-black text-amber-900 uppercase tracking-wider mb-1">설계자 주치 사항</h4>
                          <p className="text-xs text-amber-950 font-semibold leading-relaxed">
                            상기 수치는 ASME B16.5 정밀 치수 규격을 준수하고 있으며, 볼트 홀 타공은 체결 볼트 크기 대비 약 1/8" (또는 3mm) 가량 조립 공차(Clearence)를 포함한 드릴 비트 규격으로 산출되었습니다. 나사 체결 토크 연산 시 가스켓 가압 강도를 필히 재검토하시기 바랍니다.
                          </p>
                        </div>
                      </div>

                    </div>
                  ) : (
                    <div className="text-center py-10">
                      <p className="text-slate-400 text-xs font-black">해당하는 규격 정보를 불러올 수 없습니다.</p>
                    </div>
                  )}

                </div>
              </div>
            )}

          </div>
        </div>
      );
    };

    // Render application
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
